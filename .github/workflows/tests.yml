name: tests

# Déclenchement : à chaque push ou Pull Request vers develop ou main
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    # GitHub crée une machine Ubuntu vierge pour chaque exécution
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      # Télécharge le code du repo sur la machine Ubuntu
      - name: Checkout
        uses: actions/checkout@v4

      # Installe PHP 8.4 + Composer + xdebug (couverture de code)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      # Installe les dépendances PHP (dossier vendor/) sans questions interactives
      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Crée le .env à partir du .env.example (le vrai .env n'est pas dans le repo)
      # .env.example utilise SQLite — aucune base externe nécessaire
      - name: Copy Environment File
        run: cp .env.example .env

      # Génère APP_KEY dans le .env — Laravel en a besoin pour démarrer
      - name: Generate Application Key
        run: php artisan key:generate

      # Lance tous les tests Pest — vert = OK, rouge = notification d'échec
      - name: Run Tests
        run: ./vendor/bin/pest
