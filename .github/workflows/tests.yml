name: tests

# Trigger: on every push or Pull Request targeting develop or main
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    # GitHub spins up a fresh Ubuntu VM for each run
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      # Download the repository code onto the Ubuntu machine
      - name: Checkout
        uses: actions/checkout@v4

      # Install PHP 8.4 + Composer + xdebug (code coverage)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      # Install PHP dependencies (vendor/) with no interactive prompts
      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Create .env from .env.example (the real .env is gitignored)
      # .env.example uses SQLite — no external database needed
      - name: Copy Environment File
        run: cp .env.example .env

      # Generate APP_KEY in .env — Laravel requires it to boot
      - name: Generate Application Key
        run: php artisan key:generate

      # Run all Pest tests — green = OK, red = failure notification
      - name: Run Tests
        run: ./vendor/bin/pest
