name: linter

# Déclenchement : à chaque push ou Pull Request vers develop ou main
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

# Permission d'écriture sur le repo (utile si on active l'auto-commit Pint plus bas)
permissions:
  contents: write

jobs:
  quality:
    # GitHub crée une machine Ubuntu vierge pour chaque exécution
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      # Télécharge le code du repo sur la machine Ubuntu
      - uses: actions/checkout@v4

      # Installe PHP 8.4 (pas besoin de Composer ici, Pint est déjà dans vendor/)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # Installe les dépendances PHP uniquement (silencieux, pas de scripts post-install)
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # Lance Laravel Pint — vérifie que le code PHP respecte les conventions de style
      # Pint lit pint.json si présent, sinon applique le style Laravel par défaut
      # Si une ligne est mal formatée → le job échoue
      - name: Run Pint
        run: vendor/bin/pint

      # Option désactivée : commit automatique des corrections Pint directement dans le repo
      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v5
