name: linter

# Trigger: on every push or Pull Request targeting develop or main
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

# Write permission on the repo (needed if the Pint auto-commit step below is enabled)
permissions:
  contents: write

jobs:
  quality:
    # GitHub spins up a fresh Ubuntu VM for each run
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      # Download the repository code onto the Ubuntu machine
      - uses: actions/checkout@v4

      # Install PHP 8.4 (Composer not needed here, Pint is already in vendor/)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # Install PHP dependencies only (silent mode, no post-install scripts)
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # Run Laravel Pint — checks that PHP code follows style conventions
      # Pint reads pint.json if present, otherwise applies the default Laravel style
      # Any formatting violation → job fails
      - name: Run Pint
        run: vendor/bin/pint

      # Disabled: automatically commit Pint style fixes directly into the repo
      # - name: Commit Changes
